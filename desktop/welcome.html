<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
		/>
		<title>pi-ccui</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #1a1b1e;
				color: #e4e4e7;
				font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
				user-select: none;
				/* WCO：整页当标题栏拖，按钮自己不许拖 */
				-webkit-app-region: drag;
			}
			.card {
				text-align: center;
				max-width: 420px;
				padding: 48px 40px;
			}
			.logo {
				font-size: 44px;
				margin-bottom: 16px;
			}
			h1 {
				font-size: 26px;
				font-weight: 600;
				letter-spacing: 0.5px;
				margin-bottom: 10px;
			}
			.sub {
				font-size: 14px;
				color: #a1a1aa;
				line-height: 1.7;
				margin-bottom: 32px;
			}
			button {
				font-size: 15px;
				padding: 12px 28px;
				border: none;
				border-radius: 8px;
				background: #6366f1;
				color: #fff;
				cursor: pointer;
				transition: background 0.15s;
				-webkit-app-region: no-drag;
			}
			button:hover:not(:disabled) {
				background: #818cf8;
			}
			button:disabled {
				opacity: 0.55;
				cursor: default;
			}
			.status {
				margin-top: 20px;
				font-size: 13px;
				color: #a1a1aa;
				min-height: 20px;
			}
			.status.busy::after {
				content: "";
				display: inline-block;
				width: 12px;
				height: 12px;
				margin-left: 8px;
				border: 2px solid #6366f1;
				border-top-color: transparent;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				vertical-align: -2px;
			}
			.status.error {
				color: #f87171;
				user-select: text;
			}
			.hint {
				margin-top: 40px;
				font-size: 12px;
				color: #52525b;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="logo">⌁</div>
			<h1>pi-ccui</h1>
			<p class="sub">选择一个项目目录开始使用。<br />AI 智能体将以该目录为工作区运行。</p>
			<button id="pick">📂 选择项目目录</button>
			<div id="status" class="status"></div>
			<p class="hint">之后启动会自动打开上次项目，不会再看到本页。</p>
		</div>
		<script>
			const btn = document.getElementById("pick");
			const status = document.getElementById("status");
			btn.addEventListener("click", async () => {
				btn.disabled = true;
				status.className = "status";
				status.textContent = "";
				try {
					const dir = await window.piDesktop.pickDirectory();
					if (!dir) {
						btn.disabled = false; // 取消：留在欢迎页
						return;
					}
					status.className = "status busy";
					status.textContent = "正在启动服务（首次需要几秒钟）…";
					const err = await window.piDesktop.start(dir);
					if (err) {
						status.className = "status error";
						status.textContent = "启动失败：" + err;
						btn.disabled = false;
					}
					// 成功：主进程会把窗口切到主界面，这里无需善后
				} catch (e) {
					status.className = "status error";
					status.textContent = "出错了：" + (e && e.message ? e.message : String(e));
					btn.disabled = false;
				}
			});
		</script>
	</body>
</html>
